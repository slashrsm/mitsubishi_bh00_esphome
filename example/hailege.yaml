# Hailege ESP8285 ESP-01M IR transceiver.
#   IR TX = GPIO4
#   IR RX = GPIO14, inverted, pull-up
#
# This node name is mitsubishi-bh00. Change it before flashing a board that
# already has another name.
#
#   cp secrets.yaml.example secrets.yaml
#   esphome run hailege.yaml --device /dev/cu.usbserial-XXXX

substitutions:
  device_name: mitsubishi-bh00

esphome:
  name: ${device_name}
  friendly_name: Mitsubishi BH00
  min_version: 2026.11.0

esp8266:
  board: esp8285
  restore_from_flash: true

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # The receiver misses edges while the radio sleeps.
  power_save_mode: none
  ap:
    ssid: "${device_name}-fallback"
    password: !secret ap_password

captive_portal:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  port: 80
  version: 2

logger:
  level: INFO

external_components:
  - source:
      type: local
      path: ../components
    components: [mitsubishi_bh00]

remote_transmitter:
  id: ir_tx
  pin: GPIO4
  carrier_duty_percent: 50%

remote_receiver:
  id: ir_rx
  pin:
    number: GPIO14
    inverted: true
    mode:
      input: true
      pullup: true
  tolerance: 55%
  filter: 50us
  idle: 10ms

mitsubishi_bh00:
  name: Mitsubishi BH00
  transmitter_id: ir_tx
  receiver_id: ir_rx
